[project]
name = "adaptive-recursive-inference-experiment"
version = "0.1.0"
description = "An experiment with adaptive recursive inference."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "accelerate>=1.13.0",
  "jupyter>=1.1.1",
  "matplotlib>=3.10.8",
  "numpy>=2.4.4",
  "safetensors>=0.7.0",
  "scipy>=1.17.1",
  "torch>=2.11.0",
  "transformers>=5.4.0",
]

# NOTE: The default torch install includes MPS support (macOS ARM) but not CUDA.
# When building container images for Velaryon (K8s Jobs, Step 9+) or RunPod,
# install torch with CUDA 12.2 support instead:
#   pip install torch --index-url https://download.pytorch.org/whl/cu122
# See k8s/Dockerfile (to be created in Step 9) for the CUDA build.
